name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Brama.slnx

      - name: Build
        run: dotnet build Brama.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Brama.slnx --no-build --configuration Release
